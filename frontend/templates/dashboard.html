<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f1a3a">
  <title>Workspace · Synapse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232748ff'/%3E%3Cpath d='M21 10.5c-1.5-1.6-3.4-2.2-5.2-2.2-2.6 0-4.6 1.3-4.6 3.4 0 4.9 10 2.2 10 8.1 0 2.4-2.2 3.9-5.1 3.9-2.3 0-4.4-.9-5.9-2.6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/dashboard.js" defer></script>
</head>
<body class="app">
  <header class="topbar">
    <a class="brand" href="/dashboard"><span class="brand-mark">S</span>Synapse</a>
    <button class="menu-btn" id="menu" aria-label="Open projects">Projects</button>
  </header>
  <aside class="side" id="side">
    <a class="brand" href="/dashboard"><span class="brand-mark">S</span>Synapse</a>
    <button class="btn btn-primary" id="new-project">New project</button>
    <div class="side-label">Your projects</div>
    <div class="plist" id="list"></div>
    <div class="me">
      <span class="avatar" id="avatar">?</span>
      <span class="me-text"><b id="me-name">Loading</b><small id="me-email"></small></span>
      <button class="signout" id="logout">Sign out</button>
    </div>
  </aside>
  <main class="main"><div class="main-inner" id="main"></div></main>
</body>
</html>
